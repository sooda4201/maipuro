<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロジェクト投稿</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>プロジェクト活動報告投稿</h1>

  <nav>
    <a href="view.html">プロジェクト一覧</a>
  </nav>

  <form id="projectForm">

    <label>
      名前
    </label>

    <input
      type="text"
      id="name"
      required
    >

    <label>
      プロジェクト名
    </label>

    <input
      type="text"
      id="title"
      required
    >
 
    <label>
      活動のきっかけ
    </label>

    <textarea
      id="description"
      rows="10"
      required
    ></textarea>

    <label>
      内容
    </label>

    <textarea
      id="description"
      rows="10"
      required
    ></textarea>

     <label>
      活動で得た学び
    </label>

    <textarea
      id="description"
      rows="10"
      required
    ></textarea>

    <label>
      パスワード
    </label>

    <input
      type="password"
      id="password"
      required
    >

    <button type="submit">
      投稿
    </button>

    <button type="button" id="deleteButton" hidden>
      削除
    </button>

  </form>

  <script src="js/post.js"></script>

</body>
</html>
